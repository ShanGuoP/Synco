[package]
name = "synco-server"
description = "Synco 的 Axum 服务端：接管 lib/routes.js 的 API、文件服务与图像管线"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "synco"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
pathdiff = "0.2.3"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
stitch-core = { path = "../stitch-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
