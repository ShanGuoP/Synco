# 桌面壳自定义命令的 app 级 ACL。
#
# 为什么要有这个文件：窗口加载的是 http://127.0.0.1:<port>（远程域，不是 tauri:// 本地域），
# 而 Tauri 2 对**远程来源**的自定义命令一律查 ACL——没有显式放行就 reject
# "Command data_dir_info not allowed by ACL"。能力里的 `remote.urls` 只解决"能不能发 IPC"，
# 具体哪几条命令可达还得靠这里。

[[permission]]
identifier = "allow-data-dir-info"
description = "允许页面读数据目录（路径、来源、项目数与体积）"
commands.allow = ["data_dir_info"]

[[permission]]
identifier = "allow-set-data-dir"
description = "允许页面改记下来的数据目录地址（不动文件）"
commands.allow = ["set_data_dir"]

[[permission]]
identifier = "allow-copy-data-to"
description = "允许把整棵数据目录复制到新位置"
commands.allow = ["copy_data_to"]

[[permission]]
identifier = "allow-set-window-theme"
description = "允许页面把生效的主题档位交给壳记一份（窗口第一帧的底色要它）"
commands.allow = ["set_window_theme"]

[[permission]]
identifier = "allow-restart-app"
description = "允许重启桌面壳（换址与搬家之后要重启才生效）"
commands.allow = ["restart_app"]

[[permission]]
identifier = "allow-open-url"
description = "允许页面把一条 http/https 链接交给系统浏览器打开（工坊窗口自己不该跳去网站）"
commands.allow = ["open_url"]
